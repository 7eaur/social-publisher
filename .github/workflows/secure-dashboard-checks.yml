name: Secure Dashboard and Credential Onboarding

on:
  push:
    branches:
      - build/secure-onboarding-dashboard-20261017
  pull_request:
    branches:
      - build/phase-03-07-system-without-accounts-20261017

permissions:
  contents: read

jobs:
  secure-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sp_test
          POSTGRES_PASSWORD: sp_test
          POSTGRES_DB: social_publisher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sp_test -d social_publisher_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://sp_test:sp_test@localhost:5432/social_publisher_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned development packages
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Strict types
        run: npm run typecheck
      - name: Dashboard JavaScript syntax
        run: npm run test:web:syntax
      - name: Dashboard structure and security contract
        run: npm run test:web:contract
      - name: Domain, provider, media and worker tests
        run: npm test
      - name: PostgreSQL migration and concurrency tests
        run: npm run test:db
      - name: Secured API integration tests
        run: npm run test:api
      - name: Telegram indexing tests
        run: npm run test:telegram:db
