name: Railway Staging Preflight

on:
  push:
    branches: [deploy/railway-staging-bootstrap-20261018]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sp_test
          POSTGRES_PASSWORD: sp_test
          POSTGRES_DB: social_publisher_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sp_test -d social_publisher_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sp_test:sp_test@localhost:5432/social_publisher_test
      LIVE_PUBLISHING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:web:syntax
      - run: npm run test:web:contract
      - run: npm test
      - run: npm run test:db
      - run: npm run test:api
      - run: npm run test:telegram:db
      - name: Validate Railway configuration and deployment gates
        run: node -e 'const x=require("./railway.json");if(x.deploy.startCommand!=="npm run api:start"||!x.deploy.preDeployCommand.includes("npm run db:migrate")||x.deploy.healthcheckPath!=="/health/ready")process.exit(1)'
