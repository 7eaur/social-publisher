name: Phase 03 Telegram boundaries

on:
  push:
    branches: [build/phase-03-telegram-source-foundation-20261017]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sp_test
          POSTGRES_PASSWORD: sp_test
          POSTGRES_DB: social_publisher_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sp_test -d social_publisher_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://sp_test:sp_test@localhost:5432/social_publisher_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run test:api
      - run: npm run test:telegram
