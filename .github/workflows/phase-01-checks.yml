name: Phase 01 domain checks

on:
  push:
    branches:
      - build/phase-01-clean-foundation-20261013
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run pure core tests
        run: npm test
      - name: Install only development typecheck dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck strict TypeScript
        run: npm run typecheck
